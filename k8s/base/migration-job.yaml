apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-migration
  labels:
    app.kubernetes.io/name: oficina-migration
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-migration
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: oficina-runtime
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: migration
          image: ghcr.io/fiap-17soat-phantom/techchallenge-api:2.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: postgres-password
            - name: ConnectionStrings__DefaultConnection
              value: Host=$(POSTGRES_HOST);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: jwt-secret
            - name: Webhook__OrcamentoSecret
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: webhook-secret
            - name: Authentication__SeedUsers__0__Email
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: admin-email
            - name: Authentication__SeedUsers__0__Password
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: admin-password
            - name: Authentication__SeedUsers__0__Role
              value: Admin
            - name: Database__MigrateOnly
              value: "true"
            - name: Database__ApplyMigrationsOnStartup
              value: "false"
            - name: Authentication__SeedOnStartup
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
