apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-worker
  labels:
    app.kubernetes.io/name: oficina-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: oficina-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      initContainers:
        - name: wait-for-migration
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: postgres-password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: oficina-config
                  key: POSTGRES_HOST
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" &&
                [ "$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT to_regclass('public.\"OutboxMessages\"') IS NOT NULL AND to_regclass('public.\"EventosRespostaOrcamento\"') IS NOT NULL;")" = "t" ]; do
                echo "Aguardando PostgreSQL e migrations..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: ghcr.io/fiap-17soat-phantom/techchallenge-worker:2.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: oficina-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: postgres-password
            - name: ConnectionStrings__DefaultConnection
              value: Host=$(POSTGRES_HOST);Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: Email__ResendApiKey
              valueFrom:
                secretKeyRef:
                  name: oficina-secrets
                  key: resend-api-key
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
