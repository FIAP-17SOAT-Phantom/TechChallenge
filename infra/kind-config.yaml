# Config do cluster kind da Oficina Mecanica.
# Usado para criar o cluster ANTES do terraform apply (o Terraform cuida so de
# namespace + segredos). Expoe a porta 30080 (NodePort da API) para o host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
