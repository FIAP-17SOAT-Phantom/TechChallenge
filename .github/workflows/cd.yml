name: CD - Build de Imagens, Provisionamento e Deploy

# Pipeline de Entrega Continua (Fase 2):
#   1. Reexecuta build + testes automatizados (gate de qualidade).
#   2. Builda e publica as imagens Docker (API e Worker) no GHCR.
#   3. Provisiona o cluster Kubernetes (kind) e o banco com Terraform.
#   4. Aplica os manifestos YAML, roda a migration do banco e faz o deploy.
#
# Observacao: o deploy roda em um cluster kind efemero dentro do runner,
# demonstrando o fluxo completo de CD de forma reprodutivel. Para um cluster
# real (EKS/GKE/AKS), configure os secrets de nuvem e um KUBECONFIG remoto no
# job "deploy".

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # 1. Build + testes automatizados (gate antes de publicar imagens)
  # ------------------------------------------------------------------
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/OficinaMecanica.slnx

      - name: Build
        run: dotnet build src/OficinaMecanica.slnx --no-restore --configuration Release

      - name: Testes unitarios
        run: dotnet test src/OficinaMecanica.Tests/OficinaMecanica.Tests.csproj --no-build --configuration Release

  # ------------------------------------------------------------------
  # 2. Build e publicacao das imagens Docker no GHCR
  # ------------------------------------------------------------------
  docker:
    name: Build e Push das Imagens Docker
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_api: ${{ steps.meta.outputs.image_api }}
      image_worker: ${{ steps.meta.outputs.image_worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O GHCR exige o nome do repositorio em minusculas; github.repository_owner
      # pode conter maiusculas (ex.: FIAP-17SOAT-Phantom), entao normalizamos aqui.
      - name: Definir tag e nomes das imagens (lowercase)
        id: meta
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image_api=ghcr.io/${owner_lower}/techchallenge-api" >> "$GITHUB_OUTPUT"
          echo "image_worker=ghcr.io/${owner_lower}/techchallenge-worker" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OficinaMecanica.API/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_api }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_api }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push da imagem do Worker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/OficinaMecanica.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_worker }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_worker }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 3 + 4. Provisionamento (Terraform) e Deploy no Kubernetes
  # ------------------------------------------------------------------
  deploy:
    name: Provisionar e Deployar no Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Instala o kind CLI em versao fixa (v0.27.0). Esta e a UNICA versao de
      # kind no fluxo: cria o cluster e faz o "kind load docker-image" depois,
      # evitando o erro "unknown containerd config version".
      - name: Setup kind CLI
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      # Cria o cluster kind ANTES do Terraform, para que o kubeconfig/contexto
      # ja exista quando o provider kubernetes for configurado.
      - name: Criar cluster kind
        run: |
          kind create cluster \
            --name oficina-mecanica \
            --image kindest/node:v1.32.2 \
            --wait 120s \
            --config infra/kind-config.yaml
          kubectl --context kind-oficina-mecanica wait --for=condition=Ready nodes --all --timeout=180s

      # O kind nao traz o metrics-server, exigido pelo HPA (sem ele o HPA fica
      # com "cpu: <unknown>" e nao escala). Instala e habilita --kubelet-insecure-tls.
      - name: Instalar metrics-server (para o HPA)
        run: |
          ctx="kind-oficina-mecanica"
          kubectl --context $ctx apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl --context $ctx -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl --context $ctx -n kube-system rollout status deployment/metrics-server --timeout=120s || true

      # Terraform provisiona apenas namespace + segredos no cluster ja existente.
      # O banco de dados sobe depois, junto com a aplicacao, via manifestos k8s.
      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply (namespace + segredos)
        working-directory: infra
        env:
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD || 'Ci-Postgres-Pass-123456789' }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET || 'ci-jwt-secret-com-no-minimo-32-bytes-aqui!!' }}
          TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET || 'ci-webhook-secret-com-no-minimo-32-bytes!!' }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD || 'Ci-Admin-Pass-123456789' }}
        run: terraform apply -auto-approve -input=false

      # As imagens no GHCR sao privadas por padrao: autentica antes de baixar.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Carrega as imagens recem-publicadas no cluster kind.
      - name: Carregar imagens no cluster kind
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          IMAGE_API: ${{ needs.docker.outputs.image_api }}
          IMAGE_WORKER: ${{ needs.docker.outputs.image_worker }}
        run: |
          docker pull "${IMAGE_API}:${IMAGE_TAG}"
          docker pull "${IMAGE_WORKER}:${IMAGE_TAG}"
          kind load docker-image "${IMAGE_API}:${IMAGE_TAG}" --name oficina-mecanica
          kind load docker-image "${IMAGE_WORKER}:${IMAGE_TAG}" --name oficina-mecanica

      # Fixa a tag do build nos recursos que usam as imagens (API, Worker e a
      # Job de migration) com kustomize, e aplica os manifestos ja apontando para
      # a imagem carregada no cluster. Assim a migration tambem usa a imagem certa
      # (evita ImagePullBackOff). O kubectl 1.14+ ja embute o kustomize.
      - name: Aplicar manifestos e migration do banco
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          IMAGE_API: ${{ needs.docker.outputs.image_api }}
          IMAGE_WORKER: ${{ needs.docker.outputs.image_worker }}
        run: |
          # Instala o kustomize CLI para editar as tags das imagens.
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

          cd k8s/overlays/local
          kustomize edit set image \
            "${IMAGE_API}=${IMAGE_API}:${IMAGE_TAG}" \
            "${IMAGE_WORKER}=${IMAGE_WORKER}:${IMAGE_TAG}"
          # Usa o kustomize CLI (recente) para renderizar e aplica com kubectl,
          # evitando depender da versao de kustomize embutida no kubectl.
          kustomize build . | kubectl --context kind-oficina-mecanica apply -f -
          cd - >/dev/null

      # Espera na ordem de dependencia (banco -> migration -> API). Se algo nao
      # ficar pronto no tempo, imprime diagnostico completo (eventos, logs,
      # describe) NO MESMO step antes de falhar, para facilitar a investigacao.
      - name: Aguardar deploy (com diagnostico)
        run: |
          set +e
          ctx="kind-oficina-mecanica"; ns="oficina-mecanica"
          k() { kubectl --context "$ctx" -n "$ns" "$@"; }

          diagnostico() {
            echo ":::::::::::::::: DIAGNOSTICO ::::::::::::::::"
            k get all -o wide || true
            k get pvc || true
            echo "=== Eventos ==="
            k get events --sort-by=.lastTimestamp | tail -40 || true
            echo "=== describe postgres-0 ==="
            k describe pod postgres-0 | tail -40 || true
            echo "=== logs postgres ==="
            k logs statefulset/postgres --tail=60 || true
            k logs postgres-0 --previous --tail=60 || true
            echo "=== logs migration ==="
            k logs job/oficina-migration --tail=60 || true
            echo "=== describe oficina-api (um pod) ==="
            k describe pod -l app.kubernetes.io/name=oficina-api | tail -60 || true
          }

          echo ">>> Aguardando PostgreSQL..."
          if ! k rollout status statefulset/postgres --timeout=240s; then
            echo "ERRO: PostgreSQL nao ficou pronto."; diagnostico; exit 1
          fi

          echo ">>> Aguardando migration..."
          if ! k wait --for=condition=complete job/oficina-migration --timeout=240s; then
            echo "ERRO: migration nao concluiu."; diagnostico; exit 1
          fi

          echo ">>> Aguardando API..."
          if ! k rollout status deployment/oficina-api --timeout=240s; then
            echo "ERRO: API nao ficou pronta."; diagnostico; exit 1
          fi

          echo ">>> Tudo pronto."
          k get all
          k get hpa
